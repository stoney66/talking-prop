# Jaw servo settings, in ChatterPi's config.ini format.
# Copy to config.ini and adjust for your prop. An existing ChatterPi config.ini works as is.

[SERVO]
# Servo pulse widths in microseconds at each end of the jaw's travel.
servo_min = 990
servo_max = 1350
# The larger angle is the closed (resting) position. Swap the two numbers to reverse the jaw.
min_angle = 270
max_angle = 0

[CONTROLLER]
# 0 = open/shut on a single loudness threshold; 1 = four jaw positions from three levels.
style = 1
threshold = 2000
level1 = 1500
level2 = 2500
level3 = 3500

[PROP]
# ON lights LED "eyes" on eyes_pin while the prop is talking.
eyes = OFF

[PINS]
# BCM GPIO numbers.
jaw_pin = 18
eyes_pin = 25

[EYE_SERVOS]
# One eye on two servos: pan moves it side to side, tilt up and down.
# While the prop talks the eye glances to random spots; when it stops, the eye centres.
enabled = ON
pan_pin = 12
tilt_pin = 13
# Pulse widths in microseconds at each end of each servo's travel.
pan_min = 1200
pan_max = 1800
tilt_min = 1450
tilt_max = 1850
# ON reverses a direction, e.g. if "left" makes the eye look right.
pan_reverse = OFF
tilt_reverse = OFF
# How much of that travel the random glances use, from 0 (none) to 1 (all of it).
pan_range = 0.8
tilt_range = 0.5
# Seconds the eye holds each glance (a random time between these).
min_hold = 0.4
max_hold = 1.6

[PARROT]
enabled = ON
beak_pin = 21
name = Polly
chance = 0.5
speed = 1.4
servo_min = 2000
servo_max = 2200
min_angle = 90
max_angle = 0

[SONG]
# Song mode: the prop stops talking, performs a song from a WAV file, then goes back to conversation.
# Leave file empty to turn song mode off.
file = angels.wav
# Phrases that start the song, separated by commas. The prop says a short intro first.
triggers = sing us a song, sing me a song, sing a song, play us a song
# Optional button or switch: press to start the song at once, press again to stop it. 0 = none.
button_pin = 4
# ON for a switch to 3.3 V or a sensor that outputs high (ChatterPi wiring); OFF for a switch to ground.
button_active_high = ON
# Which WAV channel holds the vocals that move the jaw. right matches ChatterPi files.
jaw_channel = right
# mix = both channels to every speaker (one speaker); stereo = keep left and right separate.
output = mix
# Optional instruction to the model once the song ends. Leave empty for silence.
after_song = [The song just ended. Say one short, proud line about your performance.]
